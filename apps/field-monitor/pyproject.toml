[project]
name = "fieldmonitor"
version = "0.1.0"
description = "Satellite field monitoring: Sentinel-2 NDVI, NDRE, moisture, water, and residue indices per field"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "rasterio>=1.3.9",
  "numpy>=1.26",
  "pyproj>=3.6",
  "shapely>=2.0",
  "pillow>=10",
  "httpx>=0.27",
  "mgrs>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fieldmonitor = "fieldmonitor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fieldmonitor*"]

[tool.setuptools.package-data]
fieldmonitor = ["static/*", "static/vendor/leaflet/*", "static/vendor/leaflet/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
